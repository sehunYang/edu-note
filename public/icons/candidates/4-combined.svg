<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0a0a0a"/>
  <!-- 조합형: 모노그램(E, 두꺼운 필 형태) + 체크 배지. 배지 색상은 넛지 팔레트의
       심화 톤(원=#2A2110, 체크=#EFD34D)으로 시그니처 액센트를 준다.
       일반 아이콘도 마스크 버전과 톤을 맞추기 위해 80%로 축소(중앙 기준). -->
  <!-- 좌우 여백 비율을 원형 마스크 버전(scale 0.6, offset +14)과 동일하게 맞춘 오프셋(+7). -->
  <g transform="translate(263 256) scale(0.8) translate(-256 -256)">
    <g fill="#f5f5f5">
      <rect x="64" y="64" width="60" height="384" rx="30"/>
      <rect x="64" y="64" width="280" height="60" rx="30"/>
      <rect x="64" y="226" width="240" height="60" rx="30"/>
      <rect x="64" y="388" width="280" height="60" rx="30"/>
    </g>
    <circle cx="372" cy="372" r="92" fill="#2A2110"/>
    <path d="M 325 372 L 359 406 L 423 333" fill="none" stroke="#EFD34D" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
