<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Edu_Note — 오프라인</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0a0a0a;
    color: #e5e5e5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  main {
    max-width: 360px;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 400;
    margin: 0 0 8px;
  }
  p {
    font-size: 0.875rem;
    color: #a3a3a3;
    margin: 0 0 20px;
    line-height: 1.5;
  }
  button {
    appearance: none;
    border: 1px solid #404040;
    background: #171717;
    color: #e5e5e5;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 0.875rem;
    cursor: pointer;
  }
  button:hover {
    background: #262626;
  }
</style>
</head>
<body>
  <main>
    <h1>인터넷 연결이 필요합니다</h1>
    <p>Edu_Note는 모든 데이터를 실시간으로 서버에서 조회합니다. 연결이 복구되면 다시 시도해 주세요.</p>
    <button onclick="location.reload()">다시 시도</button>
  </main>
</body>
</html>
