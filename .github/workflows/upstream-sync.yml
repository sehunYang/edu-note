name: 업데이트 확인

# Edu_Note 업데이트 전달 (배포판 S6)
#
# Vercel Deploy 버튼은 원본을 복제(clone)하므로 GitHub 의 "Sync fork" 버튼이 없다.
# 그래서 이 워크플로가 대신 원본을 확인하고, 새 버전이 있으면 Pull Request 를 만들어
# 둔다. 교사가 할 일은 그 PR 에서 [Merge] 한 번이고, 머지되면 Vercel 이 자동 재배포하며
# 빌드 단계에서 DB 마이그레이션까지 알아서 적용된다.
#
# 자동 머지하지 않는 이유: 파괴적 스키마 변경이 섞일 수 있어 무엇이 바뀌는지 보고
# 결정할 기회가 있어야 한다. 본문에 경고를 함께 적는다.
#
# ⚠ 작성 규칙: run 블록 안에서 heredoc(<<EOF)을 쓰지 말 것. 본문 줄의 들여쓰기가 0 이면
# YAML 리터럴 블록이 거기서 끊겨 워크플로 파일 자체가 무효가 된다(초기 버전에서 실제로
# 이 문제로 파일이 파싱되지 않았다). 여러 줄 텍스트는 들여쓴 echo 로 파일에 쓴다.

on:
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 09:00 KST
  workflow_dispatch: # 저장소 Actions 탭의 수동 실행 버튼

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: sehunYang/edu-note
  UPSTREAM_BRANCH: main

jobs:
  sync:
    # 원본 저장소에서는 돌 이유가 없다(자기 자신을 확인하게 된다).
    if: github.repository != 'sehunYang/edu-note'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 원본에서 새 커밋 가져오기
        id: fetch
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || true
          git fetch --quiet upstream "${UPSTREAM_BRANCH}"
          BASE="$(git rev-parse HEAD)"
          AHEAD="$(git rev-list --count "HEAD..upstream/${UPSTREAM_BRANCH}")"
          echo "원본에 이 저장소에 없는 커밋: ${AHEAD}개"
          echo "ahead=${AHEAD}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

      - name: 최신 상태면 여기서 끝
        if: steps.fetch.outputs.ahead == '0'
        run: echo "이미 최신입니다. 만들 PR 이 없습니다."

      - name: 업데이트 브랜치 만들기
        id: branch
        if: steps.fetch.outputs.ahead != '0'
        env:
          BASE: ${{ steps.fetch.outputs.base }}
        run: |
          set -euo pipefail
          BRANCH="update/$(date +%Y%m%d-%H%M)"
          git config user.name "edu-note-updater"
          git config user.email "actions@github.com"
          git checkout -B "$BRANCH"

          # 원본과 공통 조상이 있는가?
          # Vercel Deploy 버튼이 만든 저장소는 원본을 '복사'한 것이라 git 이력을
          # 물려받지 않을 수 있다. 그러면 일반 병합이 "refusing to merge unrelated
          # histories" 로 무조건 실패하므로 경로를 나눈다.
          if git merge-base HEAD "upstream/${UPSTREAM_BRANCH}" > /dev/null 2>&1; then
            MODE="merge"
          else
            MODE="adopt"
          fi
          echo "모드: ${MODE}"

          if [ "$MODE" = "merge" ]; then
            if ! git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
              git merge --abort || true
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            # 병합 기준점이 없으므로 원본 내용을 그대로 채택한다. 무엇이 바뀌는지는
            # PR diff 에 그대로 보이고, 교사가 그걸 보고 머지 여부를 정한다.
            git read-tree --reset -u "upstream/${UPSTREAM_BRANCH}"
            if git diff --cached --quiet HEAD; then
              echo "내용이 이미 원본과 같습니다."
              echo "nochange=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit --quiet -m "Edu_Note 업데이트 ($(date +%Y-%m-%d))"
          fi

          # 이번 업데이트에 파괴적 마이그레이션이 있는가(러너와 같은 표기 규칙).
          # 여러 건을 | 로 이어 한 줄에 담는다 — GITHUB_OUTPUT 은 줄바꿈에 민감하다.
          DESTRUCTIVE=""
          for f in $(git diff --name-only --diff-filter=A "${BASE}..HEAD" -- 'lib/db/migrations/*.sql'); do
            if head -n 8 "$f" | grep -qi 'DESTRUCTIVE'; then
              DESTRUCTIVE="${DESTRUCTIVE}- $(basename "$f")|"
            fi
          done

          git push --force origin "$BRANCH"

          echo "conflict=false" >> "$GITHUB_OUTPUT"
          echo "nochange=false" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "destructive=${DESTRUCTIVE}" >> "$GITHUB_OUTPUT"

      - name: Pull Request 만들기
        if: steps.branch.outputs.conflict == 'false' && steps.branch.outputs.nochange == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          MODE: ${{ steps.branch.outputs.mode }}
          DESTRUCTIVE: ${{ steps.branch.outputs.destructive }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BODY=pr-body.md
          echo "새 버전이 나왔습니다. 아래 **Merge pull request** 를 누르면 반영됩니다." > "$BODY"
          echo "" >> "$BODY"
          echo "- 몇 분 뒤 Vercel 이 새 버전을 배포합니다." >> "$BODY"
          echo "- 데이터베이스 변경이 있으면 배포 중에 자동으로 적용됩니다." >> "$BODY"
          echo "- 기존 데이터는 그대로 유지됩니다." >> "$BODY"
          echo "" >> "$BODY"
          if [ -n "$DESTRUCTIVE" ]; then
            echo "## ⚠️ 데이터가 바뀌는 변경이 포함돼 있습니다" >> "$BODY"
            echo "" >> "$BODY"
            echo "$DESTRUCTIVE" | tr '|' '\n' >> "$BODY"
            echo "" >> "$BODY"
            echo "**머지 전에 세팅실 → 시스템 상태에서 백업을 내려받아 주세요.**" >> "$BODY"
            echo "" >> "$BODY"
          fi
          if [ "$MODE" = "adopt" ]; then
            echo "> 이 저장소는 원본의 git 이력을 물려받지 않아, 원본 내용을 그대로 가져오는 방식으로 업데이트합니다. 코드를 직접 고치신 적이 있다면 아래 diff 에서 그 부분이 되돌아가는지 확인해 주세요." >> "$BODY"
            echo "" >> "$BODY"
          fi
          echo "<sub>이 PR 은 주 1회 자동으로 만들어집니다. 자세한 내용은 docs/UPDATE.md 를 보세요.</sub>" >> "$BODY"

          if ! gh pr create --title "Edu_Note 업데이트 ($(date +%Y-%m-%d))" --body-file "$BODY" --base "$DEFAULT_BRANCH" --head "$BRANCH"; then
            echo "::warning::PR 을 자동으로 만들지 못했습니다. 저장소 Settings → Actions → General 에서 'Allow GitHub Actions to create and approve pull requests' 를 켜 주세요. 브랜치 ${BRANCH} 는 이미 푸시돼 있어 직접 PR 을 열어도 됩니다."
          fi

      - name: 충돌 안내 이슈 남기기
        if: steps.branch.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BODY=issue-body.md
          echo "원본의 새 버전을 자동으로 합치려 했으나 충돌이 났습니다." > "$BODY"
          echo "코드를 직접 고친 부분이 있으면 자연스러운 일입니다." >> "$BODY"
          echo "" >> "$BODY"
          echo "도움이 필요하면 이 내용을 그대로 복사해" >> "$BODY"
          echo "https://github.com/${UPSTREAM_REPO}/issues 에 남겨 주세요." >> "$BODY"
          gh issue create --title "업데이트 자동 병합 실패 (직접 수정한 부분과 충돌)" --body-file "$BODY" || true
